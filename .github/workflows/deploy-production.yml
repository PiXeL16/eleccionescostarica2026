# ABOUTME: GitHub Actions workflow to deploy static site to Cloudflare Pages
# ABOUTME: Builds Next.js static export with Bun and deploys via Wrangler

name: Deploy to Cloudflare Pages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Rebuild better-sqlite3 for current platform
        working-directory: web
        run: npm rebuild better-sqlite3

      - name: Build static site
        working-directory: web
        run: bun run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=eleccionescostarica2026
          workingDirectory: web
          packageManager: bun
